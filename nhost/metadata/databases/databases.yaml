- name: default
  kind: postgres
  configuration:
    connection_info:
      database_url:
        from_env: NHOST_DATABASE_URL
      isolation_level: read-committed
  tables:
    - table:
        schema: public
        name: organizations
      object_relationships:
        - name: monthly_usage
          using:
            manual_configuration:
              remote_table:
                schema: public
                name: org_monthly_usage
              column_mapping:
                id: org_id
        - name: run_stats
          using:
            manual_configuration:
              remote_table:
                schema: public
                name: org_run_stats
              column_mapping:
                id: org_id
      array_relationships:
        - name: members
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: org_members
              column: org_id
        - name: workflows
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: workflows
              column: org_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              members:
                user_id:
                  _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: org_members
      object_relationships:
        - name: organization
          using:
            foreign_key_constraint_on: org_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
            columns: "*"
      update_permissions:
        - role: user
          permission:
            filter:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
            columns: "*"
      delete_permissions:
        - role: user
          permission:
            filter:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _eq: owner
    - table:
        schema: public
        name: workflows
      object_relationships:
        - name: organization
          using:
            foreign_key_constraint_on: org_id
      array_relationships:
        - name: steps
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: workflow_steps
              column: workflow_id
        - name: triggers
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: workflow_triggers
              column: workflow_id
        - name: runs
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: workflow_runs
              column: workflow_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
            columns: "*"
      update_permissions:
        - role: user
          permission:
            filter:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
            columns: "*"
      delete_permissions:
        - role: user
          permission:
            filter:
              organization:
                members:
                  _and:
                    - user_id:
                        _eq: X-Hasura-User-Id
                    - role:
                        _in: [owner, editor]
    - table:
        schema: public
        name: workflow_steps
      object_relationships:
        - name: workflow
          using:
            foreign_key_constraint_on: workflow_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _in: [llm_call, http_request, conditional_branch, approval_gate]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _in: [db_write, notify]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
            columns: "*"
      update_permissions:
        - role: user
          permission:
            filter:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _in: [llm_call, http_request, conditional_branch, approval_gate]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _in: [db_write, notify]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
            columns: "*"
      delete_permissions:
        - role: user
          permission:
            filter:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _in: [llm_call, http_request, conditional_branch, approval_gate]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _in: [db_write, notify]
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
    - table:
        schema: public
        name: workflow_triggers
      object_relationships:
        - name: workflow
          using:
            foreign_key_constraint_on: workflow_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _neq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _eq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
            columns: "*"
      update_permissions:
        - role: user
          permission:
            filter:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _neq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _eq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
            columns: "*"
      delete_permissions:
        - role: user
          permission:
            filter:
              _and:
                - workflow:
                    organization:
                      members:
                        user_id:
                          _eq: X-Hasura-User-Id
                - _or:
                    - _and:
                        - type:
                            _neq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _in: [owner, editor]
                    - _and:
                        - type:
                            _eq: webhook
                        - workflow:
                            organization:
                              members:
                                _and:
                                  - user_id:
                                      _eq: X-Hasura-User-Id
                                  - role:
                                      _eq: owner
    - table:
        schema: public
        name: workflow_runs
      object_relationships:
        - name: workflow
          using:
            foreign_key_constraint_on: workflow_id
      array_relationships:
        - name: step_runs
          using:
            foreign_key_constraint_on:
              table:
                schema: public
                name: step_runs
              column: workflow_run_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              workflow:
                organization:
                  members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in: [owner, editor]
            columns: "*"
    - table:
        schema: public
        name: step_runs
      object_relationships:
        - name: workflow_run
          using:
            foreign_key_constraint_on: workflow_run_id
        - name: step
          using:
            foreign_key_constraint_on: step_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow_run:
                workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: db_write_results
      object_relationships:
        - name: workflow_run
          using:
            foreign_key_constraint_on: run_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow_run:
                workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: notifications
      object_relationships:
        - name: workflow_run
          using:
            foreign_key_constraint_on: run_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow_run:
                workflow:
                  organization:
                    members:
                      user_id:
                        _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: event_trigger_source
      object_relationships:
        - name: workflow
          using:
            foreign_key_constraint_on: workflow_id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              workflow:
                organization:
                  members:
                    user_id:
                      _eq: X-Hasura-User-Id
      insert_permissions:
        - role: user
          permission:
            check:
              workflow:
                organization:
                  members:
                    _and:
                      - user_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _in: [owner, editor]
            columns: "*"
    - table:
        schema: public
        name: org_run_stats
      object_relationships:
        - name: organization
          using:
            manual_configuration:
              remote_table:
                schema: public
                name: organizations
              column_mapping:
                org_id: id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
    - table:
        schema: public
        name: org_monthly_usage
      object_relationships:
        - name: organization
          using:
            manual_configuration:
              remote_table:
                schema: public
                name: organizations
              column_mapping:
                org_id: id
      select_permissions:
        - role: user
          permission:
            columns: "*"
            filter:
              organization:
                members:
                  user_id:
                    _eq: X-Hasura-User-Id
